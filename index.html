<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0A2A6A">
  <meta name="referrer" content="no-referrer">
  <meta id="meta-description" name="description" content="AgriLingua is a multilingual grape field assistant for photo diagnosis, practical next steps, and voice answers.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AgriLingua">
  <title>AgriLingua | Grape Field Assistant</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="./icons/icon-192.png" alt="">
        <div class="brand-copy">
          <h1>AgriLingua</h1>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="install-button" class="install-button" type="button" aria-label="Install AgriLingua" data-i18n-aria="installAria" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"></path>
            <path d="M5 20h14"></path>
          </svg>
          <span data-i18n="install">Install</span>
        </button>
        <div class="language-control">
          <span class="language-label" data-i18n="language">Language</span>
          <button id="language-button" class="language-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-menu" data-i18n-aria="languageAria">
            <span id="language-button-label" class="language-current">English</span>
            <span id="language-button-code" class="language-code" aria-hidden="true">EN</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 10 4 4 4-4"></path>
            </svg>
          </button>
          <div id="language-menu" class="language-menu" role="listbox" aria-label="Language" data-i18n-aria="languageAria" hidden>
            <button class="language-option" type="button" role="option" data-language="en" aria-selected="true">
              <span>English</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>
            </button>
            <button class="language-option" type="button" role="option" data-language="zh" aria-selected="false">
              <span>中文</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>
            </button>
            <button class="language-option" type="button" role="option" data-language="ja" aria-selected="false">
              <span>日本語</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>
            </button>
          </div>
          <select id="language-input" class="language-native" aria-hidden="true" tabindex="-1">
            <option value="en" selected>English</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
          </select>
        </div>
      </div>
    </header>

    <main class="app-content">
      <section class="welcome" id="welcome-panel">
        <div class="quick-prompts welcome-quick-prompts" id="quick-prompts"></div>
      </section>

      <section id="chat-log" class="chat-log" aria-live="polite"></section>
    </main>

    <section id="composer" class="composer" aria-label="Message composer" data-i18n-aria="composerAria">
      <div id="image-preview" class="image-preview" hidden></div>

      <div id="composer-tools" class="composer-tools" aria-label="Message tools" data-i18n-aria="toolsPanelAria" hidden>
        <label class="tool-button" for="camera-input" title="Take a photo" data-i18n-title="takePhoto">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4 7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9Z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span data-i18n="takePhoto">Take photo</span>
        </label>
        <label class="tool-button" for="image-input" title="Choose from gallery" data-i18n-title="gallery">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="24" height="16" rx="3"></rect>
            <circle cx="8.5" cy="9" r="1.5"></circle>
            <path d="m4 17 5-5 4 4 2-2 5 5"></path>
          </svg>
          <span data-i18n="gallery">Gallery</span>
        </label>
        <button id="new-chat-button" class="tool-button" type="button" aria-label="Start a new chat" data-i18n-aria="newChatAria">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span data-i18n="newChat">New chat</span>
        </button>
        <button id="context-button" class="tool-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M7 12h10M9 17h6"></path>
          </svg>
          <span data-i18n="fieldDetails">Field details</span>
        </button>
      </div>

      <div class="message-row">
        <button id="voice-toggle" class="voice-toggle" type="button" aria-label="Switch to text">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path>
          </svg>
        </button>

        <div class="entry-area">
          <button id="hold-button" class="hold-button" type="button" aria-label="Hold to talk. Tap to type." data-i18n-aria="holdToTalkAria">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="12" rx="3"></rect>
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"></path>
            </svg>
            <span class="hold-copy">
              <strong data-i18n="holdToTalk">Hold to talk</strong>
              <small data-i18n="tapToType">Tap to type</small>
            </span>
          </button>

          <div id="text-composer" class="text-composer" hidden>
            <textarea id="question-input" rows="1" maxlength="3000" placeholder="Type something" data-i18n-placeholder="placeholder"></textarea>
            <button id="send-button" class="send-button" type="button" aria-label="Send message" data-i18n-aria="send">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 4 17 8-17 8 3-8-3-8Z"></path>
                <path d="M7 12h14"></path>
              </svg>
              <span class="sr-only" data-i18n="send">Send</span>
            </button>
          </div>
        </div>

        <button id="tools-button" class="tools-button" type="button" aria-label="More tools" aria-expanded="false" aria-controls="composer-tools" data-i18n-aria="moreTools">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </div>

  <dialog id="context-dialog" class="context-dialog">
    <div class="dialog-surface">
      <div class="dialog-header">
        <div>
          <span class="eyebrow" data-i18n="optional">OPTIONAL</span>
          <h2 data-i18n="fieldDetails">Field details</h2>
        </div>
        <button id="context-close" class="dialog-close" type="button" aria-label="Close field details" data-i18n-aria="closeFieldDetails">×</button>
      </div>
      <p class="dialog-copy" data-i18n="fieldDetailsCopy">Add local context to make the guidance more relevant.</p>
      <div class="context-grid">
        <label>
          <span data-i18n="country">Country</span>
          <input id="country-input" type="text" value="Kenya" autocomplete="country-name">
        </label>
        <label>
          <span data-i18n="grapeStage">Grape stage</span>
          <select id="stage-input">
            <option value="" data-i18n="notSpecified">Not specified</option>
            <option value="budbreak" data-i18n="stageBudbreak">Budbreak</option>
            <option value="flowering" data-i18n="stageFlowering">Flowering</option>
            <option value="fruit_set" selected data-i18n="stageFruitSet">Fruit set</option>
            <option value="veraison" data-i18n="stageVeraison">Veraison</option>
            <option value="harvest" data-i18n="stageHarvest">Harvest</option>
            <option value="postharvest" data-i18n="stagePostharvest">Postharvest</option>
            <option value="dormant" data-i18n="stageDormant">Dormant</option>
          </select>
        </label>
        <label class="wide-field">
          <span data-i18n="weather">Recent weather</span>
          <input id="weather-input" type="text" placeholder="Example: three days of warm, wet weather" data-i18n-placeholder="weatherPlaceholder">
        </label>
      </div>
      <button id="context-save" class="dialog-save" type="button" data-i18n="useDetails">Use these details</button>
    </div>
  </dialog>

  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,.heic,.heif,.avif" multiple hidden>

  <template id="message-template">
    <article class="message">
      <div class="message-role"></div>
      <div class="message-images"></div>
      <div class="message-body"></div>
      <div class="audio-wrap" hidden>
        <div class="audio-topline">
          <span class="audio-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 10v4h3l4 4V6L8 10H5Z"></path>
              <path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path>
            </svg>
          </span>
          <div>
            <div class="audio-label">Voice answer</div>
            <div class="audio-hint">Listen to the field guidance</div>
          </div>
        </div>
        <audio controls preload="metadata"></audio>
        <a class="audio-download" target="_blank" rel="noopener noreferrer">Open audio</a>
      </div>
    </article>
  </template>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
