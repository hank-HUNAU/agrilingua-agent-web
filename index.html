<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6b45">
  <meta name="referrer" content="no-referrer">
  <title>神农语智 AgriLingua</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">神</div>
        <div>
          <h1>神农语智</h1>
          <p>AgriLingua · 葡萄田间助手</p>
        </div>
      </div>
      <button id="new-chat-button" class="icon-button" type="button" aria-label="开始新对话">
        新对话
      </button>
    </header>

    <section class="welcome" id="welcome-panel">
      <div class="welcome-copy">
        <span class="eyebrow">中 · 英 · 日</span>
        <h2>拍一张葡萄叶，问清下一步该怎么做。</h2>
        <p>支持文字、语音转文字后的提问，以及最多两张葡萄照片。结果包含图文建议与语音链接。</p>
      </div>
      <div class="quick-prompts" id="quick-prompts"></div>
    </section>

    <section id="chat-log" class="chat-log" aria-live="polite"></section>

    <section class="composer" aria-label="输入区域">
      <div id="image-preview" class="image-preview" hidden></div>

      <details class="context-panel">
        <summary>补充田间信息（可选）</summary>
        <div class="context-grid">
          <label>
            <span>国家</span>
            <input id="country-input" type="text" value="Kenya" autocomplete="country-name">
          </label>
          <label>
            <span>葡萄阶段</span>
            <select id="stage-input">
              <option value="">未填写</option>
              <option value="budbreak">萌芽</option>
              <option value="flowering">开花</option>
              <option value="fruit_set" selected>坐果</option>
              <option value="veraison">转色</option>
              <option value="harvest">采收</option>
              <option value="postharvest">采后</option>
              <option value="dormant">休眠</option>
            </select>
          </label>
          <label class="wide-field">
            <span>近期天气</span>
            <input id="weather-input" type="text" placeholder="例如：连续降雨三天，天气温暖潮湿">
          </label>
        </div>
      </details>

      <div class="message-row">
        <label class="attach-button" for="image-input" title="上传葡萄照片">
          <span aria-hidden="true">＋</span>
          <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        </label>

        <label class="language-control">
          <span class="sr-only">回答语言</span>
          <select id="language-input">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>

        <textarea id="question-input" rows="1" maxlength="3000" placeholder="输入葡萄种植或病害问题，也可以上传照片……"></textarea>

        <button id="mic-button" class="mic-button" type="button" aria-label="语音输入" title="语音输入">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
          </svg>
        </button>

        <button id="send-button" class="send-button" type="button">发送</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <p class="privacy-note">照片仅用于本次识别，请勿上传人脸、证件或隐私信息。结果仅作筛查，不替代实验室检测。</p>
    </section>
  </main>

  <template id="message-template">
    <article class="message">
      <div class="message-role"></div>
      <div class="message-images"></div>
      <div class="message-body"></div>
      <div class="audio-wrap" hidden>
        <div class="audio-label">语音说明</div>
        <audio controls preload="metadata"></audio>
        <a class="audio-download" target="_blank" rel="noopener noreferrer">打开语音链接</a>
      </div>
    </article>
  </template>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
